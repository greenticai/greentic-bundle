[package]
name = "bundle-standard-core"
version.workspace = true
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Pure-Rust workspace+ZIP assembly for the bundle-standard recipe."
repository = "https://github.com/greenticai/greentic-bundle"
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies.greentic-types]
version = ">=1.1.0-dev, <1.2.0-0"
default-features = false
features = [
    "std",
    "serde",
]

[dependencies.semver]
version = "1"
default-features = false

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.sha2]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.zip]
workspace = true
default-features = false
features = [
    "deflate",
]

[dev-dependencies.zip]
workspace = true
default-features = false
features = [
    "deflate",
]
