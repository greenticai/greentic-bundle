name: Nightly Coverage

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      GREENTIC_BUNDLE_USE_BUNDLED_CATALOG: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install SquashFS tools
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update && timeout 300 sudo apt-get install -y squashfs-tools; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "apt-get failed after 3 attempts" >&2; exit 1; fi
            echo "apt-get attempt $attempt failed or timed out; retrying in 15s" >&2
            sleep 15
          done

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main

      - name: Install coverage toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rustup component add llvm-tools-preview
          cargo binstall --no-confirm --force --disable-strategies compile greentic-dev cargo-llvm-cov cargo-nextest
          command -v greentic-dev
          command -v cargo-llvm-cov
          command -v cargo-nextest

      - name: Validate coverage policy
        run: greentic-dev coverage
