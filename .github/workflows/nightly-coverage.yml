name: Nightly Coverage

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      GREENTIC_BUNDLE_USE_BUNDLED_CATALOG: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install SquashFS tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main

      - name: Install coverage toolchain
        run: |
          rustup component add llvm-tools-preview
          cargo binstall --no-confirm --force greentic-dev cargo-llvm-cov cargo-nextest

      - name: Validate coverage policy
        run: greentic-dev coverage
