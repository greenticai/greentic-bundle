name: Publish Catalog

on:
  push:
    branches:
      - main
      - master
    paths:
      - "packs/well-known.json"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-well-known-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1
      - name: Login to GHCR
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Publish well-known catalog
        shell: bash
        run: |
          set -euo pipefail
          base_ref="ghcr.io/greenticai/catalogs/well-known"
          sha_ref="${base_ref}:sha-${GITHUB_SHA}"
          latest_ref="${base_ref}:latest"

          oras push "$sha_ref" \
            --artifact-type application/vnd.greentic.catalog.v1+json \
            --annotation "org.opencontainers.image.title=well-known.json" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.description=Greentic well-known pack catalog" \
            --annotation "org.opencontainers.image.licenses=MIT" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "packs/well-known.json:application/json"

          oras copy "$sha_ref" "$latest_ref"
