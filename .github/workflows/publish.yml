name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in the form vX.Y.Z
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release-meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      primary_package: ${{ steps.meta.outputs.primary_package }}
      primary_binary: ${{ steps.meta.outputs.primary_binary }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="$(python3 ci/workspace_publish.py primary-version)"
          primary_package="$(python3 ci/workspace_publish.py primary-name)"
          primary_binary="$(python3 ci/workspace_publish.py primary-binary)"
          expected_tag="v${version}"
          if [ "$tag" != "$expected_tag" ]; then
            printf 'Tag mismatch: expected %s but received %s\n' "$expected_tag" "$tag" >&2
            exit 1
          fi
          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'primary_package=%s\n' "$primary_package"
            printf 'primary_binary=%s\n' "$primary_binary"
          } >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash ci/local_check.sh

  create-release:
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - verify
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          generate_release_notes: true

  publish-crates:
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - verify
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dry-run crates.io publish
        run: bash ci/local_check.sh --package-only
      - name: Publish crates.io packages
        shell: bash
        run: |
          set -euo pipefail
          dry_run_publish() {
            crate_name="$1"
            attempt=1
            while true; do
              if cargo publish -p "$crate_name" --dry-run --locked; then
                return 0
              fi
              if [ "$attempt" -ge 6 ]; then
                printf 'cargo publish --dry-run failed for %s after %s attempts\n' "$crate_name" "$attempt" >&2
                return 1
              fi
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }

          publish_crate() {
            crate_name="$1"
            attempt=1
            while true; do
              if cargo publish -p "$crate_name" --locked; then
                return 0
              fi
              if [ "$attempt" -ge 3 ]; then
                printf 'cargo publish failed for %s after %s attempts\n' "$crate_name" "$attempt" >&2
                return 1
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          while IFS="$(printf '\t')" read -r crate_name _ internal_deps; do
            [ -n "$crate_name" ] || continue
            if [ -n "${internal_deps:-}" ]; then
              printf 'Running delayed cargo publish --dry-run for %s after publishing workspace dependencies: %s\n' "$crate_name" "$internal_deps"
            fi
            dry_run_publish "$crate_name"
            publish_crate "$crate_name"
            sleep 30
          done <<EOF
$(python3 ci/workspace_publish.py plan)
EOF

  binstall-build:
    name: binstall-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs:
      - release-meta
      - verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            archive_ext: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive_ext: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.release-meta.outputs.version }}"
          binary="${{ needs.release-meta.outputs.primary_binary }}"
          stem="${binary}-${version}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${binary}" "dist/${binary}"
          tar -C dist -czf "dist/${stem}.tar.gz" "${binary}"
          rm "dist/${binary}"
          shasum -a 256 "dist/${stem}.tar.gz" > "dist/${stem}.tar.gz.sha256"
      - name: Package Windows archive
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $version = "${{ needs.release-meta.outputs.version }}"
          $binary = "${{ needs.release-meta.outputs.primary_binary }}"
          $stem = "$binary-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$binary.exe" "dist/$binary.exe"
          Compress-Archive -Path "dist/$binary.exe" -DestinationPath "dist/$stem.zip" -Force
          Remove-Item "dist/$binary.exe"
          $hash = (Get-FileHash "dist/$stem.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/$stem.zip.sha256" -Value "$hash  $stem.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: binstall-${{ matrix.target }}
          path: dist/*

  attach-binstall-assets:
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - create-release
      - binstall-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binstall-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          files: dist/*

  ghcr-publish:
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - binstall-build
      - verify
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binstall-*
          merge-multiple: true
          path: dist
      - uses: oras-project/setup-oras@v1
      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token="${GHCR_TOKEN:-${GITHUB_TOKEN}}"
          printf '%s' "$token" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Push OCI artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.release-meta.outputs.version }}"
          package_name="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          for asset in dist/*; do
            [ -f "$asset" ] || continue
            filename="$(basename "$asset")"
            ref="ghcr.io/${package_name}/${{ needs.release-meta.outputs.primary_package }}:${version}-$(printf '%s' "$filename" | tr '/:' '--')"
            oras push "$ref" \
              --annotation "org.opencontainers.image.title=$filename" \
              --annotation "org.opencontainers.image.version=$version" \
              --artifact-type application/vnd.greentic.binstall.archive \
              "$asset:application/octet-stream"
          done
