name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: greenticai/.github/.github/workflows/host-crate-ci.yml@main
    with:
      run-semver-checks: true
      setup-script: "sudo apt-get update && sudo apt-get install -y squashfs-tools"

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 ci/i18n_check.py validate
      - run: python3 ci/i18n_check.py status

  package-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate crate packaging includes bundled assets
        if: github.event_name == 'pull_request'
        run: cargo package --allow-dirty --no-verify
      - run: bash ci/local_check.sh --package-only
