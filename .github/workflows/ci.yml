name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: greenticai/.github/.github/workflows/pr-ci.yml@main
    with:
      variant: host
      setup-script: "sudo apt-get update && sudo apt-get install -y squashfs-tools"

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 ci/i18n_check.py validate
      - run: python3 ci/i18n_check.py status

  package-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      # The `cargo package --allow-dirty --no-verify` step below was removed
      # during the 0.4 → 0.5 cascade: root-crate packaging tries to resolve
      # greentic-bundle-reader ">=0.5.0-0, <0.6.0-0" against crates.io, but the
      # sister crate only exists there at 0.4.x until this PR publishes. The
      # package-only path in local_check.sh has skip-if-unpublished logic and
      # covers the same ground. Re-add the bare `cargo package` once all
      # workspace members are at 0.5.x on crates.io.
      - run: bash ci/local_check.sh --package-only
