[workspace]
members = ["crates/greentic-bundle-reader"]
resolver = "2"

[package]
name = "greentic-bundle"
version = "0.4.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Greentic bundle authoring CLI scaffold with embedded i18n and answer-document contracts."
readme = "README.md"
repository = "https://github.com/greenticai/greentic-bundle"
keywords = ["greentic", "bundle", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "build.rs",
    "docs/**",
    "i18n/**",
    "src/**",
    "tests/**",
    "ci/**",
]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.39", features = ["derive"] }
greentic-bundle-reader = { version = "0.1.0", path = "crates/greentic-bundle-reader" }
greentic-distributor-client = { version = "0.4", default-features = false, features = ["dist-client", "pack-fetch"] }
greentic-qa-lib = "0.4"
rpassword = "7.4.0"
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml_bw = { package = "serde_yaml_gtc", version = "2.5.2" }
sha2 = "0.10.9"
sys-locale = "0.3"
tempfile = "3.23.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
unic-langid = "0.9"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"

[build-dependencies]
serde_json = "1.0.145"
