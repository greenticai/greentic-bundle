[workspace]
members = [
    "crates/greentic-bundle-reader",
    "crates/cards2pack-core",
    "crates/bundle-standard-core",
]
resolver = "2"

[workspace.package]
version = "1.1.1-dev.0"

[workspace.dependencies]
anyhow = "1"
# default-features dropped to exclude `parallel` (rayon): the parallel squashfs
# reader sizes its thread pool to the host core count, ignores the container's
# CPU cgroup quota, and silently yields a 0-byte extraction when throttled.
backhand = { version = "0.25", default-features = false, features = ["xz", "gzip", "zstd", "lz4"] }
assert_cmd = "2"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
constant_time_eq = "0.5"
criterion = "0.8"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "zeroize"] }
hex = "0.4"
zeroize = "1"
bundle-standard-core = { version = ">=0.6.0-0, <0.7.0-0", path = "crates/bundle-standard-core" }
greentic-bundle-reader = { version = ">=1.1.1-dev, <1.2.0-0", path = "crates/greentic-bundle-reader" }
greentic-distributor-client = { version = ">=1.1.0-dev, <1.2.0-0", default-features = false, features = ["dist-client", "pack-fetch"] }
greentic-qa-lib = ">=1.1.0-dev, <1.2.0-0"
greentic-secrets-spec = ">=1.1.0-dev, <1.2.0-0"
jsonschema = { version = "0.46", default-features = false }
predicates = "3"
rpassword = "7"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_bw = { package = "serde_yaml_gtc", version = "2.5.2" }
thiserror = "2"
sha2 = "0.11"
sys-locale = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
unic-langid = "0.9"
dirs = "6"
tracing = "0.1"
walkdir = "2"
zip = { version = "=7.1.0", default-features = false, features = ["deflate"] }

[package]
name = "greentic-bundle"
version.workspace = true
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Greentic bundle authoring CLI scaffold with embedded i18n and answer-document contracts."
readme = "README.md"
repository = "https://github.com/greenticai/greentic-bundle"
keywords = ["greentic", "bundle", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "build.rs",
    "i18n-locales.json",
    "docs/**",
    "i18n/**",
    "registries/**",
    "src/**",
    "tests/**",
    "ci/**",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tgz"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
anyhow.workspace = true
backhand.workspace = true
ciborium.workspace = true
clap.workspace = true
constant_time_eq.workspace = true
greentic-bundle-reader.workspace = true
ed25519-dalek.workspace = true
greentic-distributor-client.workspace = true
greentic-qa-lib.workspace = true
greentic-secrets-spec.workspace = true
hex.workspace = true
rpassword.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_bw.workspace = true
sha2.workspace = true
sys-locale.workspace = true
tempfile.workspace = true
tokio.workspace = true
unic-langid.workspace = true
zeroize.workspace = true
zip.workspace = true
dirs.workspace = true
tracing.workspace = true
walkdir.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
criterion.workspace = true
httpmock = "0.8"
predicates.workspace = true
sha2.workspace = true
tempfile.workspace = true
zip.workspace = true

[build-dependencies]
serde_json.workspace = true

[[bench]]
name = "perf"
harness = false

[features]
default = []
