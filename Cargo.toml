[workspace]
members = [
    "crates/greentic-bundle-reader",
    "crates/cards2pack-core",
    "crates/bundle-standard-core",
]
resolver = "2"

[workspace.package]
version = "0.5.9"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
constant_time_eq = "0.5"
criterion = "0.8"
greentic-bundle-reader = { version = ">=0.5.0-0, <0.6.0-0", path = "crates/greentic-bundle-reader" }
greentic-distributor-client = { version = ">=0.5.0-0, <0.6.0-0", default-features = false, features = ["dist-client", "pack-fetch"] }
greentic-qa-lib = ">=0.5.0-0, <0.6.0-0"
jsonschema = { version = "0.46", default-features = false }
predicates = "3"
rpassword = "7"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_bw = { package = "serde_yaml_gtc", version = "2.5.2" }
thiserror = "2"
sha2 = "0.11"
sys-locale = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
unic-langid = "0.9"
dirs = "6"
tracing = "0.1"
walkdir = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[package]
name = "greentic-bundle"
version.workspace = true
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Greentic bundle authoring CLI scaffold with embedded i18n and answer-document contracts."
readme = "README.md"
repository = "https://github.com/greenticai/greentic-bundle"
keywords = ["greentic", "bundle", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "build.rs",
    "i18n-locales.json",
    "docs/**",
    "i18n/**",
    "registries/**",
    "src/**",
    "tests/**",
    "ci/**",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tgz"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
anyhow.workspace = true
ciborium.workspace = true
clap.workspace = true
constant_time_eq.workspace = true
greentic-bundle-reader.workspace = true
greentic-distributor-client.workspace = true
greentic-qa-lib.workspace = true
rpassword.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_bw.workspace = true
sha2.workspace = true
sys-locale.workspace = true
tempfile.workspace = true
tokio.workspace = true
unic-langid.workspace = true
zip.workspace = true
dirs.workspace = true
tracing.workspace = true

# feature: extensions (bundle-ext Phase A — host-side schema/registry only).
# WASM execution path was removed pending crates.io-publishable runtime crates;
# tracked in https://github.com/greenticai/greentic/issues/175.
jsonschema = { workspace = true, optional = true, default-features = false }
thiserror = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd.workspace = true
criterion.workspace = true
predicates.workspace = true
sha2.workspace = true
tempfile.workspace = true
zip.workspace = true

[build-dependencies]
serde_json.workspace = true

[[bench]]
name = "perf"
harness = false

[features]
default = []
extensions = [
  "dep:jsonschema",
  "dep:thiserror",
  "dep:walkdir",
]
