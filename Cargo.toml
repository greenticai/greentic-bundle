[workspace]
members = ["crates/greentic-bundle-reader"]
resolver = "2"

[workspace.package]
version = "0.4.15"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
greentic-bundle-reader = { version = "0.4", path = "crates/greentic-bundle-reader" }
greentic-distributor-client = { version = "0.4", default-features = false, features = ["dist-client", "pack-fetch"] }
greentic-qa-lib = "0.4"
predicates = "3"
rpassword = "7"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_bw = { package = "serde_yaml_gtc", version = "2.5.2" }
sha2 = "0.10"
sys-locale = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
unic-langid = "0.9"

[package]
name = "greentic-bundle"
version.workspace = true
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Greentic bundle authoring CLI scaffold with embedded i18n and answer-document contracts."
readme = "README.md"
repository = "https://github.com/greenticai/greentic-bundle"
keywords = ["greentic", "bundle", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "build.rs",
    "docs/**",
    "i18n/**",
    "registries/**",
    "src/**",
    "tests/**",
    "ci/**",
]

[dependencies]
anyhow.workspace = true
clap.workspace = true
greentic-bundle-reader.workspace = true
greentic-distributor-client.workspace = true
greentic-qa-lib.workspace = true
rpassword.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_bw.workspace = true
sha2.workspace = true
sys-locale.workspace = true
tempfile.workspace = true
tokio.workspace = true
unic-langid.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true

[build-dependencies]
serde_json.workspace = true
